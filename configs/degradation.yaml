low_light:
  light: {gamma: 1.5}
  medium: {gamma: 2.5}
  strong: {gamma: 4.0}
  methods: [gamma_correction, clahe]
gaussian_noise:
  light: {sigma: 10}
  medium: {sigma: 25}
  strong: {sigma: 50}
  methods: [gaussian_filter, bilateral_filter]
salt_pepper:
  light: {amount: 0.01}
  medium: {amount: 0.03}
  strong: {amount: 0.07}
  salt_vs_pepper: 0.5
  methods: [median_filter, gaussian_filter]
gaussian_blur:
  light: {kernel: 3}
  medium: {kernel: 7}
  strong: {kernel: 15}
  methods: [unsharp_mask, sharpening]
color_cast:
  light: {gains: [1.05, 1.00, 0.95]}
  medium: {gains: [1.15, 1.00, 0.85]}
  strong: {gains: [1.30, 1.00, 0.70]}
  methods: [rgb_balance, hsv_correction, lab_correction]
