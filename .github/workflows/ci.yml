name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src app_components streamlit_app.py tests scripts
      - run: python -m compileall -q src app_components streamlit_app.py scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_project.py
      - run: python scripts/check_notebook.py
      - name: Streamlit startup smoke
        run: |
          streamlit run streamlit_app.py --server.headless=true --server.port=8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8501/_stcore/health
          kill "$app_pid"
